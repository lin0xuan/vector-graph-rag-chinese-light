[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-graph-rag-chinese-light"
version = "0.1.0"
description = "A lightweight Chinese vector-graph retrieval and question-answering library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastembed==0.7.4"]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.scripts]
vgrag-zh = "vector_graph_rag_chinese_light.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
